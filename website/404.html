<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — InteFlow</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/ui.css" />
    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          window.localStorage.getItem("if-theme") === "dark" ? "dark" : "light"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span> 404 / NOT FOUND</p>
        <h1>这一页<br /><em>走丢了。</em></h1>
        <p>
          可能是链接过期，也可能是题目太新。回到首页，或者直接去下载 / 试用。
        </p>
        <div class="not-found-actions">
          <a class="btn btn-ink" href="./" data-root="">回到首页 <span aria-hidden="true">→</span></a>
          <a class="btn btn-outline" href="./download.html" data-root="download.html">下载桌面版</a>
          <a class="btn btn-outline" href="./demo.html" data-root="demo.html">在线试用</a>
        </div>
      </div>
    </main>
    <script>
      (function () {
        var onPages = location.pathname.indexOf("/InteFlow/") === 0;
        var base = location.protocol === "file:" ? "./" : onPages ? "/InteFlow/" : "/";
        Array.prototype.forEach.call(document.querySelectorAll("[data-root]"), function (link) {
          link.setAttribute("href", base + link.getAttribute("data-root"));
        });
      })();
    </script>
    <script src="assets/ui.js" defer></script>
  </body>
</html>
