<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — InteFlow</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <style>
      .not-found {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 40px 20px;
        background-image: linear-gradient(
            to right,
            rgba(20, 21, 15, 0.055) 1px,
            transparent 1px
          );
        background-size: 88px 100%;
      }
      .not-found-inner {
        max-width: 560px;
        border: 1px solid var(--ink);
        background: var(--surface);
        padding: 42px;
        box-shadow: 12px 12px 0 var(--accent);
      }
      .not-found h1 {
        margin: 18px 0 0;
        font-family: var(--font-display);
        font-size: clamp(44px, 9vw, 76px);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      .not-found h1 em {
        color: var(--accent);
        font-style: normal;
      }
      .not-found p {
        margin-top: 16px;
        color: var(--ink-2);
        font-size: 13.5px;
        line-height: 1.8;
      }
      .not-found .btn {
        margin-top: 26px;
      }
      @media (max-width: 520px) {
        .not-found-inner {
          padding: 26px;
          box-shadow: 7px 7px 0 var(--accent);
        }
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span> 404 / NOT FOUND</p>
        <h1>这一页<em>走丢了</em>。</h1>
        <p>
          可能是链接过期，也可能是题目太新。回到首页，从导入一套题库开始。
        </p>
        <a class="btn btn-ink" href="./" data-home>回到首页 <span aria-hidden="true">→</span></a>
      </div>
    </main>
    <script>
      (function () {
        var link = document.querySelector("[data-home]");
        if (!link) return;
        if (location.pathname.indexOf("/InteFlow/") === 0) {
          link.setAttribute("href", "/InteFlow/");
        }
      })();
    </script>
  </body>
</html>
